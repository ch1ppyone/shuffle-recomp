# Sonic Shuffle (USA), MK-51060 V1.000 -- measured on the owner's CHD.

[game]
id = "sonicshuffle"
title = "Sonic Shuffle"
region = "USA"
product = "MK-51060"

[disc]
sha1_1st_read = "1a3b3633ac9f54168246f14828621b14ceceb2c0"

[binary]
path = "extracted/fs/1ST_READ.BIN"
load_address = 0x8C010000
link_address = 0x0C010000
entry = 0x8C010000

# Observed at runtime: BIOS exception and interrupt handlers copied from the boot image.
[[relocations]]
source = 0x0C030A74
size = 0x34
dest = 0x8C000000
entry = 0x8C000000

[[relocations]]
source = 0x0C030A18
size = 0x58
dest = 0x8C000600
entry = 0x8C000600
no_fold = true

# Overlays read from their own files on the disc. Measured: dumping RAM after the board loads and
# searching for each SUBPROG file's first bytes found TRAP.BIN at 0x8C500000 and MAPSTART.BIN at
# 0x8C600000. `overlay` because the same address holds different modules at different times, so the
# dispatch checks the bytes before using a translation.
# 0x8C500000 is a shared overlay slot: TITLE.BIN is there during boot, TRAP.BIN later. Both are
# translated for that address and the runtime dispatches on the code words in RAM.
[[relocations]]
file = "../extracted/disc/fs/SUBPROG/TITLE.BIN"
dest = 0x8C500000
overlay = true
# The overlay's first word is a pointer to 0x8C500214, and a call from 0x0C09400E reaches it at
# frame 119 of the boot scenario. Discovery did not follow the header pointer.
# 0x0C500020 is the debug-row name getter (it copies the nine-entry name table and indexes it by
# the player's character id). Seed it so the ninth-id override can hook it.
entries = [0x0C500214, 0x0C500020]

[[relocations]]
file = "../extracted/disc/fs/SUBPROG/TRAP.BIN"
dest = 0x8C500000
overlay = true
# Entry points the run reached that discovery inside the overlay did not find.
entries = [0x0C500020, 0x0C500024, 0x0C50002C, 0x0C500046, 0x0C500064, 0x0C50006E,
             0x0C5000F0, 0x0C5000F4, 0x0C500100, 0x0C500130, 0x0C5001B4, 0x0C5001C0,
             0x0C50020A, 0x0C500214, 0x0C5002C4, 0x0C5002DE, 0x0C5005F6, 0x0C500610,
             0x0C500616, 0x0C50063A, 0x0C500662, 0x0C500676, 0x0C5007CC, 0x0C500838,
             0x0C50308C, 0x0C50320E, 0x0C50336C, 0x0C503418, 0x0C503A80, 0x0C503B70,
             0x0C503C8A, 0x0C503DE0, 0x0C504374, 0x0C504526, 0x0C50456C, 0x0C5045B8,
             0x0C504616, 0x0C504690, 0x0C5047F0, 0x0C5048B0, 0x0C5048FE, 0x0C50492A,
             0x0C50494C, 0x0C504956, 0x0C5049E2, 0x0C504A36, 0x0C504C42, 0x0C504C66,
             0x0C504C9A, 0x0C504D30, 0x0C505158, 0x0C5052C4, 0x0C505314, 0x0C50557E,
             0x0C505A26, 0x0C505A3C, 0x0C505A60, 0x0C505A82]
# A VBlank saved a task context at this instruction (the jsr itself, not a call return); 2060
# resumes in the mash-A board run. It is inside a translated TRAP function, so split the block
# there instead of seeding it as a function entry.
resume = [0x0C505A5A]

# The opening movie loads MOVIE.BIN into the same slot (936 bytes). A call at frame 621 reaches
# 0x8C500024, which is the entry its first word points to.
[[relocations]]
file = "../extracted/disc/fs/SUBPROG/MOVIE.BIN"
dest = 0x8C500000
overlay = true
entries = [0x0C500024]

# Two more modules in the shared slot, identified from the first word of the slot while the
# untranslated-call trace ran: START.BIN (0x8C500020) around frame 11000 and ONES.BIN
# (0x8C500838) shortly after. Only their real entry points are seeded here; call-return addresses
# inside them (0x1B4, 0x610, 0x616, ...) are resume points, not function entries.
[[relocations]]
file = "../extracted/disc/fs/SUBPROG/START.BIN"
dest = 0x8C500000
overlay = true
entries = [0x0C500020]

[[relocations]]
file = "../extracted/disc/fs/SUBPROG/ONES.BIN"
dest = 0x8C500000
overlay = true
entries = [0x0C500838]

# VS mode overlays. START SELECT loads DUEL/BATTLE into the shared 0x8C500000 slot; keep them
# separate from TITLE/TRAP so their character-selection code can be translated and patched without
# changing the development menu or the original eight-character data.
[[relocations]]
file = "../extracted/disc/fs/SUBPROG/DUEL.BIN"
dest = 0x8C500000
overlay = true
entries = [0x0C50159E]

[[relocations]]
file = "../extracted/disc/fs/SUBPROG/BATTLE.BIN"
dest = 0x8C500000
overlay = true
entries = [0x0C503472, 0x0C506210]

[[relocations]]
file = "../extracted/disc/fs/SUBPROG/MAPSTART.BIN"
dest = 0x8C600000
overlay = true

# Minigames, loaded by the TITLE development menu into the 0x8C500000 slot. Each file's first word is
# the entry the loader calls; discovery follows calls from there. These three are the first batch:
# GENERAL 17 (MG030), SPECIAL 4 (SMG32), CLEAR 1 (CMG11).
