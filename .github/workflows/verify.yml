name: Verify

on:
  push:
  pull_request:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check repository contents
        run: |
          ! find . -type f \( -iname '*.chd' -o -iname '*.gdi' -o -iname '*.cue' -o -iname '*.iso' -o -iname '*.bin' -o -iname '*.pvr' \) -not -path './.git/*' | grep .
          ! grep -RIni --exclude-dir=.git --exclude-dir=dreamcomp --exclude='*.lock' \
            -E 'localization|russian|русск|--mod|mod/' src game android scripts README.md THIRD_PARTY_NOTICES.md
